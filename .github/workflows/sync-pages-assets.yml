name: Sync built Pages assets
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'index.html'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-pages-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pages-assets
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit generated Pages assets
        run: |
          if git diff --quiet -- assets icon-180.png icon-192.png icon-512.png manifest.webmanifest sw.js .nojekyll; then
            echo "Generated files are already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets icon-180.png icon-192.png icon-512.png manifest.webmanifest sw.js .nojekyll
          git commit -m "build: sync Pages assets"
          git push
